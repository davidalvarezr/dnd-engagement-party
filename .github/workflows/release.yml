name: Release

on:
  push:
    branches:
      - main

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  tag:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

  build-and-push:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dnd-engagement-party:${{ needs.tag.outputs.new_tag }}
            ghcr.io/${{ github.repository_owner }}/dnd-engagement-party:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sync-develop:
    needs: [tag, build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Open PR to sync main into develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh pr merge --auto right after gh pr create can race GitHub's async
          # mergeability computation and fail with "Pull request is in unstable
          # status (enablePullRequestAutoMerge)", so retry with backoff.
          enable_automerge() {
            local pr_ref="$1"
            for attempt in 1 2 3 4 5; do
              if gh pr merge "$pr_ref" --auto --merge; then
                return 0
              fi
              echo "enabling auto-merge failed (attempt $attempt/5), retrying in 10s..."
              sleep 10
            done
            echo "::error::failed to enable auto-merge on $pr_ref after retries"
            return 1
          }

          git fetch origin main develop

          if [ "$(git rev-list origin/develop..origin/main --count)" -eq 0 ]; then
            echo "develop already has everything from main, nothing to sync"
            exit 0
          fi

          existing_pr="$(gh pr list --base develop --head main --state open --json number --jq '.[0].number')"

          if [ -n "$existing_pr" ]; then
            echo "sync PR #$existing_pr already open, ensuring auto-merge is enabled"
            enable_automerge "$existing_pr"
            exit 0
          fi

          pr_url="$(gh pr create \
            --base develop \
            --head main \
            --title "chore: sync main into develop" \
            --body "Automated sync after release ${{ needs.tag.outputs.new_tag }}, so develop doesn't drift behind main and future develop -> main PRs don't get blocked as out-of-date.")"

          enable_automerge "$pr_url"
