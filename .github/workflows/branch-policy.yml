name: Branch Policy

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Restrict merges into main
        run: |
          head_ref="${{ github.head_ref }}"
          if [[ "$head_ref" != "develop" && "$head_ref" != hotfix/* ]]; then
            echo "::error::Only 'develop' or a 'hotfix/*' branch may be merged into main (got '$head_ref')."
            exit 1
          fi
