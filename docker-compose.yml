services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-dnd_engagement_party}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dnd_engagement_party}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: ghcr.io/davidalvarezr/dnd-engagement-party:latest
    container_name: web
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_PRISMA_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-dnd_engagement_party}
      HOST_URL: ${HOST_URL:?HOST_URL is required}
      API_KEY: ${API_KEY:?API_KEY is required}
      NODE_ENV: production
    ports:
      - "3000:3000"
    # Real guest data never lives in the image or git history - it's
    # mounted straight from this host's gitignored working tree.
    volumes:
      - ./prisma/guests-data.ts:/app/prisma/guests-data.ts:ro
      - ./prisma/fixups.ts:/app/prisma/fixups.ts:ro

  db-backup:
    image: prodrigestivill/postgres-backup-local:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-dnd_engagement_party}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # ghcr.io package is private, so watchtower needs the host's
      # docker login credentials to check for updates. Run:
      #   docker login ghcr.io -u <user> -p <PAT with read:packages scope>
      - ${DOCKER_CONFIG:-$HOME/.docker/config.json}:/config.json:ro
    environment:
      WATCHTOWER_CLEANUP: "true"
    command: --interval 300 web

volumes:
  postgres_data:
